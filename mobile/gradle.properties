org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Android Studio Run changes injected deployment properties between builds.
# AGP 9.3 can otherwise reuse a stale Kotlin/Hilt javac classpath on Windows.
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
kotlin.code.style=official


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# Local Windows checkout includes Turkish characters in its parent directory.
android.overridePathCheck=true
